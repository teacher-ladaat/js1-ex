<!DOCTYPE html>
<html lang="he" dir="rtl">

    <head>
        <meta charset="UTF-8">
        <title>תרגיל JavaScript 1 - חלק א'</title>
        <script>
            // א1
            const fullname = "רחל כהן", city = "ירושלים", isStudent = true;
            let age = 20;
            console.log(`שמי ${fullname}, גילי ${age}, אני${isStudent ? '' : ' לא'} תלמידה וגרה ב${city}`);
            age++;
            console.log(`שמי ${fullname}, גילי ${age}, אני${isStudent ? '' : ' לא'} תלמידה וגרה ב${city}`);

            // Uncaught TypeError: Assignment to constant variable.
            // fullname = "חני לוי";

            // א2
            console.log(typeof 42);        // number
            console.log(typeof 3.14);      // number
            console.log(typeof "שלום");    // string
            console.log(typeof true);      // boolean
            console.log(typeof undefined); // undefined
            console.log(typeof null);      // object

            // א3
            console.log(5 == "5");           // true
            console.log(5 === "5");          // false
            console.log(0 == false);         // true
            console.log(0 === false);        // false
            console.log(null == undefined);  // true
            console.log(null === undefined); // false
            console.log(NaN === NaN);        // false
            console.log("a" === "a");        // true

            console.log(Boolean(0));         // false
            console.log(Boolean(""));        // false
            console.log(Boolean("0"));       // true
            console.log(Boolean([]));        // true
            console.log(Boolean(null));      // false
            console.log(Boolean(undefined)); // false
            console.log(Boolean("false"));   // true
            console.log(Boolean(-1));        // true
            
            // תמיד נשתמש ב-=== ולא ב-==
        </script>
    </head>

    <body>
        <h1>חלק א'</h1>
        <p>פתחי את הקונסולה (F12) כדי לראות את התוצאות.</p>
    </body>

</html>
